<svg xmlns="http://www.w3.org/2000/svg" width="960" height="496" viewBox="0 0 960 496" role="img" aria-label="四階段流程：中文問題 → LLM 路由 → Python 白名單派送 → LLM 寫摘要 → Python 輸出檢查">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#86868B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Segoe UI", sans-serif; text-anchor: middle; dominant-baseline: central; }
      .t { font-size: 14px; font-weight: 600; fill: #1D1D1F; }
      .s { font-size: 12px; fill: #6E6E73; }
      .lbl { font-size: 12px; fill: #6E6E73; }
      .step { fill: #F5F5F7; }
      .core { fill: #EBF3FF; stroke: #3186FF; stroke-width: 1.2; }
      .end { fill: #FFFFFF; stroke: #D2D2D7; stroke-width: 1; }
      .edge { fill: none; stroke: #86868B; stroke-width: 1.5; marker-end: url(#arrow); }
      .pill { fill: #FFFFFF; }
    </style>
  </defs>

  <rect width="960" height="496" fill="#FFFFFF"/>

  <!-- edges -->
  <path class="edge" d="M160 96 H202"/>
  <path class="edge" d="M400 96 H442"/>
  <path class="edge" d="M668 96 H710"/>
  <path class="edge" d="M816 144 V210"/>
  <path class="edge" d="M712 260 H622"/>
  <path class="edge" d="M816 308 V378"/>
  <path class="edge" d="M712 416 H582"/>
  <path class="edge" d="M500 380 V298"/>
  <path class="edge" d="M420 416 H282"/>

  <!-- edge labels -->
  <rect class="pill" x="646" y="250" width="40" height="20" rx="10"/><text class="lbl" x="666" y="260">通過</text>
  <rect class="pill" x="790" y="334" width="52" height="20" rx="10"/><text class="lbl" x="816" y="344">不通過</text>
  <rect class="pill" x="480" y="328" width="40" height="20" rx="10"/><text class="lbl" x="500" y="338">通過</text>
  <rect class="pill" x="318" y="406" width="64" height="20" rx="10"/><text class="lbl" x="350" y="416">仍不通過</text>

  <!-- row 1 -->
  <rect class="step" x="40" y="48" width="120" height="96" rx="14"/>
  <text class="t" x="100" y="96">中文問題</text>

  <rect class="step" x="204" y="48" width="196" height="96" rx="14"/>
  <text class="t" x="302" y="76">① LLM 路由</text>
  <text class="s" x="302" y="100">輸出 JSON</text>
  <text class="s" x="302" y="119">{tool, arguments}</text>

  <rect class="step" x="444" y="48" width="224" height="96" rx="14"/>
  <text class="t" x="556" y="76">② Python 白名單派送</text>
  <text class="s" x="556" y="100">檢查參數 → 查 SEC / Yahoo</text>
  <text class="s" x="556" y="119">計算年增率、毛利率</text>

  <rect class="step" x="712" y="48" width="208" height="96" rx="14"/>
  <text class="t" x="816" y="76">③ LLM 寫摘要</text>
  <text class="s" x="816" y="100">只能引用工具回傳的數字</text>
  <text class="s" x="816" y="119">附〔來源編號〕</text>

  <!-- row 2 -->
  <rect class="core" x="712" y="212" width="208" height="96" rx="14"/>
  <text class="t" x="816" y="240">④ Python 輸出檢查</text>
  <text class="s" x="816" y="264">數字有根據？</text>
  <text class="s" x="816" y="283">沒有禁用詞？</text>

  <rect class="end" x="380" y="224" width="240" height="72" rx="14"/>
  <text class="t" x="500" y="249">摘要 + SEC 原文連結</text>
  <text class="s" x="500" y="272">+ 免責聲明</text>

  <!-- row 3 -->
  <rect class="step" x="712" y="380" width="208" height="72" rx="14"/>
  <text class="t" x="816" y="416">帶著問題清單重寫一次</text>

  <rect class="step" x="420" y="380" width="160" height="72" rx="14"/>
  <text class="t" x="500" y="416">再檢查</text>

  <rect class="end" x="40" y="380" width="240" height="72" rx="14"/>
  <text class="t" x="160" y="416">攔截，不顯示摘要</text>
</svg>
